name: Improve the guide
description: Suggest a correction, clearer explanation, or synthetic review exercise.
title: "[Guide]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue will be public. Use synthetic examples only. Do not include private code, scan reports, credentials, personal data, or confidential URLs. For a vulnerability, use the private reporting route instead.
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to improve?
      options:
        - Correction
        - Clearer explanation
        - New synthetic exercise or counterexample
        - Navigation or accessibility
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Which page or idea needs work?
      description: Link to a file in this repository and explain the problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the reasoning. Use a minimal synthetic excerpt if useful.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public primary reference, if relevant
      description: An official specification or vendor document. No private links.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked that this issue contains no secrets, private code, personal data, or real scan report.
          required: true
