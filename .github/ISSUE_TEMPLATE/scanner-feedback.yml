name: Share scanner feedback
description: Explain confusing behavior using a synthetic example, without sharing a real report.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Feedback is public. This repository does not contain the hosted scanner source. Do not paste a real scan report, private repository URL, secret, personal data, or an exploitable vulnerability. Use the private disclosure route for sensitive reports.
  - type: dropdown
    id: kind
    attributes:
      label: Feedback type
      options:
        - A flagged instruction may be legitimate
        - A synthetic concerning instruction was not flagged
        - Confusing result or coverage explanation
        - Usability or accessibility
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Intended task and expected behavior
      description: Describe the legitimate task and the boundary you expected the tool to help review.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal synthetic example
      description: A short, non-executable excerpt you have permission to publish. Use placeholders, not real data or endpoints.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What you observed
      description: Describe the result and reported coverage in your own words. Do not upload a real report or screenshot containing sensitive details.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This is a synthetic public example with no secrets, private code, personal data, or real report.
          required: true
        - label: This is ordinary product feedback, not a vulnerability disclosure that belongs in the private reporting channel.
          required: true
